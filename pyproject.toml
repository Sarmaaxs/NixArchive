[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nixarchive"
version = "1.0.0"
description = "Lossless compression for related WAV files"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
flac = ["soundfile>=0.12"]
dev  = ["pytest>=7", "soundfile>=0.12"]

[project.scripts]
nixarchive = "repeatzip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
